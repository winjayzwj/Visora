<!doctype html>
<html lang="zh-CN" class="font-sans">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="description" content="映序 AI 创作工作台" />
        <link rel="icon" type="image/png" href="/brand/visora-mark.png" />
        <title>Visora AI · 映序</title>
        <script>
            try {
                var s = JSON.parse(localStorage.getItem("visora:theme_store") || "{}");
                var t = s.state && s.state.theme === "light" ? "light" : "dark";
                // HeroUI 默认主题同时认 `.dark` 与 `[data-theme="dark"]`，两个都写上。
                document.documentElement.classList.toggle("dark", t === "dark");
                document.documentElement.setAttribute("data-theme", t);
                document.documentElement.style.colorScheme = t;
            } catch (e) {}
        </script>
    </head>
    <body class="bg-background text-foreground antialiased">
        <div id="root"></div>
        <script src="/config.js"></script>
        <script type="module" src="/src/main.tsx"></script>
    </body>
</html>
